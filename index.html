<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>帳號大商人 VJ｜現貨區</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071022;color:#f5f7ff;font-family:Arial,"Noto Sans TC",sans-serif}
header{background:#071329;border-bottom:1px solid #213b67;position:sticky;top:0;z-index:3}.nav{max-width:1100px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#1ab7f5,#7041ef);font-weight:900}.brand b{font-size:20px}.brand small{display:block;color:#9eafd0;letter-spacing:3px;margin-top:3px}.spacer{flex:1}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer}.blue{background:linear-gradient(100deg,#2869ed,#783ef0);color:#fff}.orange{background:linear-gradient(100deg,#ff4051,#ff7919);color:#fff}.wrap{max-width:1100px;margin:auto;padding:34px 20px 70px}.hero h1{font-size:clamp(45px,8vw,78px);line-height:1;margin:10px 0}.hero h1 span{color:#ff4d4d}.hero h1 em{color:#2bb6f4;font-style:normal}.hero p{color:#b5c5dc;font-size:19px}.cats{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}.cat{padding:12px 18px;border:1px solid #2a4773;border-radius:14px;background:#091630;color:white;font-weight:800;cursor:pointer}.cat.on{background:#6844ef}.tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:20px 0}.tools input,.tools select{padding:15px;border-radius:13px;border:1px solid #2a4773;background:#08152c;color:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#0b1730;border:1px solid #263f6a;border-radius:19px;overflow:hidden;cursor:pointer}.pic{height:190px;background:#132644;display:grid;place-items:center;color:#6f89ae;font-size:60px}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:17px}.title{font-size:20px;font-weight:900;line-height:1.45}.game{color:#9fb2d1;margin:7px 0}.price{font-size:28px;color:#2ab5f4;font-weight:900}.tag{display:inline-block;background:#14375a;color:#8edcff;padding:5px 8px;border-radius:7px;font-size:12px;margin-top:8px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#000b;z-index:9;padding:20px;align-items:center;justify-content:center}.modal.show{display:flex}.box{width:min(620px,100%);max-height:90vh;overflow:auto;background:#0b1730;border:1px solid #2b4772;border-radius:20px;padding:22px}.close{float:right;background:none;border:0;color:#aabbd5;font-size:32px}.detailimg{width:100%;max-height:380px;object-fit:contain;background:#132644;border-radius:14px}.line{display:block;text-align:center;background:#19b86b;color:white;text-decoration:none;padding:15px;border-radius:12px;font-weight:900;margin-top:18px}.empty{color:#93a6c4}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}.tools{grid-template-columns:1fr}.contact{display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr}.pic{height:180px}}
</style></head>
<body>
<header><div class="nav"><div class="logo">VJ</div><div class="brand"><b>帳號大商人 VJ</b><small>VJ GAME STORE</small></div><div class="spacer"></div><a class="btn blue" href="/admin.html">管理後台</a></div></header>
<main class="wrap">
<section class="hero"><div style="letter-spacing:5px;color:#a9bad5;font-weight:900">VJ GAME STORE</div><h1><span>專業遊戲</span><br><em>帳號現貨區</em></h1><p>傳說對決、決勝時刻、Free Fire｜現貨帳號</p></section>
<div class="cats" id="cats"></div>
<div class="tools"><input id="q" placeholder="搜尋商品..." oninput="render()"><select id="sort" onchange="render()"><option value="new">最新上架</option><option value="low">價格低到高</option><option value="high">價格高到低</option></select></div>
<div id="count" style="color:#9fb1cf;font-weight:800;margin-bottom:12px"></div>
<div class="grid" id="grid"></div>
</main>
<div class="modal" id="modal" onclick="if(event.target===this)closeM()"><div class="box"><button class="close" onclick="closeM()">×</button><img id="di" class="detailimg" style="display:none"><div id="dicon" class="pic">VJ</div><h2 id="dt"></h2><div id="dg" class="game"></div><div id="dp" class="price"></div><p id="dd" style="color:#b7c7dd;line-height:1.8"></p><a class="line" href="https://line.me/ti/p/@079bqcyz" target="_blank">LINE 客服：@079bqcyz</a></div></div>
<script>
let data=[],active="全部";
async function load(){data=await fetch("/api/products").then(r=>r.json());cats();render()}
function cats(){let gs=["全部",...new Set(data.map(x=>x.game))];document.getElementById("cats").innerHTML=gs.map(g=>`<button class="cat ${g===active?"on":""}" onclick="active='${g}';cats();render()">${g==="全部"?"🎮 全部商品":"🎮 "+g}</button>`).join("")}
function render(){let q=document.getElementById("q").value.toLowerCase(),list=data.filter(x=>(active==="全部"||x.game===active)&&(x.title+x.game).toLowerCase().includes(q));let s=document.getElementById("sort").value;if(s==="low")list.sort((a,b)=>a.price-b.price);if(s==="high")list.sort((a,b)=>b.price-a.price);document.getElementById("count").textContent=`目前顯示 ${list.length} 件現貨`;document.getElementById("grid").innerHTML=list.map(x=>`<article class="card" onclick="openM(${x.id})"><div class="pic">${x.image?`<img src="${x.image}">`:"🎮"}</div><div class="info"><div class="title">${esc(x.title)}</div><div class="game">🎮 ${esc(x.game)}</div><div class="price">NT$ ${Number(x.price).toLocaleString()}</div><span class="tag">現貨</span></div></article>`).join("")||"<p class='empty'>目前沒有現貨。</p>"}
function openM(id){let x=data.find(y=>y.id===id);document.getElementById("dt").textContent=x.title;document.getElementById("dg").textContent="🎮 "+x.game;document.getElementById("dp").textContent="NT$ "+Number(x.price).toLocaleString();document.getElementById("dd").textContent=x.description||"詳細資訊請洽 LINE 客服。";let im=document.getElementById("di"),ic=document.getElementById("dicon");if(x.image){im.src=x.image;im.style.display="block";ic.style.display="none"}else{im.style.display="none";ic.style.display="grid"}document.getElementById("modal").classList.add("show")}
function closeM(){document.getElementById("modal").classList.remove("show")}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
load();
</script></body></html>
