<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VJ 管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#071022;color:#f5f7ff;font-family:Arial,"Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:30px 18px 70px}h1{margin-top:0}.panel{background:#0b1730;border:1px solid #29446e;border-radius:18px;padding:20px;margin:18px 0}.login{max-width:440px;margin:8vh auto}.input{width:100%;padding:14px;margin:7px 0 12px;border-radius:11px;border:1px solid #29446e;background:#071329;color:white}.btn{border:0;border-radius:11px;padding:13px 18px;font-weight:900;cursor:pointer}.primary{background:#315fec;color:white}.danger{background:#e94352;color:white}.muted{color:#9fb1cf}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid #1d3153}.thumb{width:90px;height:65px;object-fit:cover;border-radius:8px;background:#152846}.grow{flex:1}.actions{display:flex;gap:7px}@media(max-width:600px){.row{grid-template-columns:1fr}.product{align-items:flex-start}.actions{flex-direction:column}}
</style></head><body><main class="wrap">
<div id="login" class="panel login"><h1>VJ 管理後台</h1><p class="muted">登入後可以上架、修改、下架現貨。</p><input id="u" class="input" placeholder="管理員帳號"><input id="p" class="input" type="password" placeholder="管理員密碼"><button class="btn primary" onclick="login()">登入</button><p id="msg" class="muted"></p></div>
<div id="app" style="display:none"><h1>現貨管理</h1><button class="btn" onclick="logout()">登出</button>
<div class="panel"><h2 id="formTitle">上架新現貨</h2><input type="hidden" id="id"><div class="row"><div><label>商品名稱</label><input id="title" class="input"></div><div><label>遊戲</label><select id="game" class="input"><option>傳說對決</option><option>決勝時刻M</option><option>Free Fire</option></select></div></div><div class="row"><div><label>價格（NT$）</label><input id="price" class="input" type="number"></div><div><label>商品圖片</label><input id="image" class="input" type="file" accept="image/*"></div></div><label>商品描述</label><textarea id="desc" class="input" rows="4"></textarea><button class="btn primary" onclick="save()">上架商品</button> <button class="btn" onclick="resetForm()">清除</button><p id="status" class="muted"></p></div>
<div class="panel"><h2>現有商品</h2><div id="list"></div></div></div></main>
<script>
async function me(){let x=await fetch("/api/me").then(r=>r.json());if(x.loggedIn)showApp()}function showApp(){document.getElementById("login").style.display="none";document.getElementById("app").style.display="block";load()}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u.value,password:p.value})});let x=await r.json();if(r.ok)showApp();else msg.textContent=x.error}
async function logout(){await fetch("/api/logout",{method:"POST"});location.reload()}
async function load(){let d=await fetch("/api/products").then(r=>r.json());list.innerHTML=d.map(x=>`<div class="product"><img class="thumb" src="${x.image||'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2290%22 height=%2265%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23152846%22/></svg>'}"><div class="grow"><b>${esc(x.title)}</b><div class="muted">${esc(x.game)}｜NT$ ${Number(x.price).toLocaleString()}</div></div><div class="actions"><button class="btn" onclick="edit(${x.id})">編輯</button><button class="btn danger" onclick="del(${x.id})">下架</button></div></div>`).join("")||"<p class='muted'>還沒有商品。</p>";window.products=d}
async function save(){let f=new FormData();f.append("title",title.value);f.append("game",game.value);f.append("price",price.value);f.append("description",desc.value);if(image.files[0])f.append("image",image.files[0]);let id=document.getElementById("id").value;let r=await fetch(id?"/api/products/"+id:"/api/products",{method:id?"PUT":"POST",body:f});let x=await r.json();if(!r.ok){status.textContent=x.error;return}status.textContent="已儲存";resetForm();load()}
function edit(id){let x=products.find(a=>a.id===id);document.getElementById("id").value=x.id;title.value=x.title;game.value=x.game;price.value=x.price;desc.value=x.description||"";formTitle.textContent="編輯現貨 #"+id;scrollTo(0,0)}
async function del(id){if(!confirm("確定要下架這個商品嗎？"))return;await fetch("/api/products/"+id,{method:"DELETE"});load()}
function resetForm(){document.getElementById("id").value="";title.value="";price.value="";desc.value="";image.value="";formTitle.textContent="上架新現貨"}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}me();
</script></body></html>
